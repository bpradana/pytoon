[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoon-encoder"
version = "0.1.0"
description = "Python port of the TOON encoder, producing a concise, human-readable data format."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bintang Pradana Erlangga Putra" }]
keywords = ["toon", "serialization", "data-format", "text", "encoding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "mypy>=1.8",
    "ruff>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/bpradana/pytoon"
Repository = "https://github.com/bpradana/pytoon"
Issues = "https://github.com/bpradana/pytoon/issues"
Upstream = "https://github.com/johannschopplich/toon"

[tool.setuptools.packages.find]
include = ["pytoon*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["pytoon"]
